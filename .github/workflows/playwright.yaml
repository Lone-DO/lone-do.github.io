name: Call Playwright Tests
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sha:
        description: 'The commit SHA to run the tests against'
        required: true
      environment:
        description: 'The environment to run the tests in'
        default: 'mac-dev'
        required: true

jobs:
  call-playwright-tests:
    uses: lone-do/playwright/.github/workflows/remote-dispatch.yml@main
    with:
      sha: ${{ github.sha }}
      environment: mac-dev
      repository: ${{ github.repository }}
      # token: ${{ secrets.GITHUB_TOKEN }}
